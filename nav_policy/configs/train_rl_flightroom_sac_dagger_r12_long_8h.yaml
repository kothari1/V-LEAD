# Overnight 8h SAC run: 1600 episodes, 20-rollout training pool, stable
# dagger_r12 base, no video dump.
#
# Why bigger than the 600-ep _long config:
#   - More episodes -> more replay diversity if the rollouts are varied
#   - At 4 train rollouts only, 1600 eps = 400 visits per start.
#     Bump to 20 train rollouts (10 from 071353 + 10 from 071718,
#     sub_idx 0 on each val pt) so 80 visits per start instead.
#
# Wall-clock budget (rough):
#   1600 eps x ~13 s avg rollout = ~5.8 h
#   eval: 8 events x 14 queries x ~30 s     = ~56 min
#   sim cache rebuilds: 16 x ~20 s          = ~5 min
#   SAC updates: 400 iters x 8 x 0.18 s     = ~10 min
#   Total target: ~6.5-8 h
#
# Storage:
#   1600 mp4s at ~30 MB each = ~48 GB — drop --save-videos for this run.
#   Replay at 50k cap fp16 = ~150 GB RAM peak.
#   30 checkpoints at ~50 MB = ~1.5 GB.

base_config: configs/train_rl_flightroom_sac_dagger_r12.yaml

rl:
  run_tag: rl_sac_dagger_r12_long_8h
  n_iterations: 400              # 400 * 4 = 1600 episodes

  sac:
    updates_per_iter: 8
    replay_capacity: 50000       # ~150 GB fp16 in 251 GB host

  eval_every_episodes: 200       # 8 events instead of 100 at 16-step cadence
  sim_cache_clear_every_episodes: 100
  save_every_n_iterations: 10    # 40 ckpts (every 40 eps) for eval_queue use later

# Expanded training rollout pool: random.shuffle + slice picks 4 per iter
# (default rollouts_per_iteration: 4) so each iter samples 4 of 20. Over
# 400 iters: each rollout seen ~80 times instead of 400 in the canonical
# 4-rollout pool.
