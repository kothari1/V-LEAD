# SAC RL fine-tuning from the balanced-DAgger r12 BC seed (flightroom-matched).
# Inherits canonical SAC hyperparams + rollouts + rewards from
# configs/train_rl_flightroom_sac.yaml. Only three fields change:
#   - checkpoint  (point at the new BC/DAgger seed)
#   - rl.run_tag, rl.checkpoint_dir  (separate output namespace)
# init_log_std and freeze_backbone stay at canonical defaults (-0.5, false)
# because the seed is at ~60% success on flightroom — we still need
# exploration + encoder flexibility to push past the BC prior.

base_config: configs/train_rl_flightroom_sac.yaml

checkpoint: data/checkpoints/bc_best_balanced_dagger_r12_new.pt

rl:
  run_tag: rl_sac_dagger_r12
  checkpoint_dir: data/rl_runs/dagger_r12
  # v4 SAC actor diverged catastrophically by iter 19 (mean_return -19287,
  # q1_loss 4 -> 150, alpha stuck at 0.98, 0% success). Stabilization
  # adopts Rahul's stable PPO config style:
  #   - freeze_backbone: true     (no vision-encoder drift)
  #   - init_log_std: -2.5        (very tight Gaussian noise)
  #   - bc_anchor.kl_coef: 0.02   (penalize KL(BC || current) in policy_loss)
  #   - timeout_penalty: -20      (discourage hover-near-goal)
  #   - collision_penalty: -50    (stop trading collisions for distance)
  #   - max_rollout_s: 35         (cut wasted timeout cost)
  # Auto-alpha disabled (auto_alpha: false) since it stuck at 0.98 in v4;
  # fix alpha at 0.1 instead so the entropy bonus can't overwhelm Q.
  init_log_std: -2.5
  freeze_backbone: true
  bc_anchor:
    kl_coef: 0.02
  # Publishable success metric: deterministic closed-loop eval on the 12-query
  # held-out 071733 suite every 16 episodes (= every 4 iters with
  # rollouts_per_iteration=4). Saves _best.pt based on eval success rate
  # (not noisy training mean_return). Logs goal_success / n_rollouts per
  # query to stdout + meta + TB text.
  eval_every_episodes: 16
  # 14 stratified held-out queries from 071733 pool (q12, 19, 26, 33, 40, 47,
  # 54, 61, 68, 75, 82, 89, 96, 103) — distinct from Rahul's first-12 suite
  # so the dagger_r12 runs report on our own dedicated held-out set.
  eval_config: configs/eval_closed_loop_flightroom_holdout_14.yaml
  eval_deterministic: true
  rollout:
    max_rollout_s: 35.0
    settle_vel_mps: 0.4
    # LPF keeps controller-side smoothing on top of the very tight
    # init_log_std + frozen backbone; jitter should be near-zero now.
    action_lpf_alpha: 0.25
  rewards:
    collision_penalty: -50.0
    timeout_penalty: -20.0
    action_smooth_weight: 0.3
  sac:
    ref_kl_coef: 0.02
    auto_alpha: false
    alpha: 0.1
