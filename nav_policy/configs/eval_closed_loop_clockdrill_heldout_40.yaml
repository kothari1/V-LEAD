# Held-out eval on the TRAINED goals (green clock + yellow drill), spawns
# DISJOINT from the 50 training tasks. This is where RL CAN improve and where
# best.pt selection should happen -- the 110 ladder suite is a different object
# never seen in RL training (cross-object generalization check, run separately).
#
# 20 clock (071353) + 20 drill (071718) = 40 held-out spawns, none overlapping
# the training indices {0,9,...,216}.

frame: carl
Kv: 2.0
Ka: 5.0

metrics:
  time_buffer_s: 5.0
  collision_depth_threshold_m: 0.25
  goal_position_tol_m: 0.5
  goal_yaw_tol_rad: 0.5
  success_tracking_tol_m: 1.0
  bbox_margin: 2.0
  depth_inference_stride: 3
  check_collision: true
  check_goal: true
  warmup_steps: 30
  warmup_kp_pos: 2.0
  warmup_kd_vel: 1.0
  warmup_kp_yaw: 2.0
  warmup_max_vel: 0.8
  warmup_max_yaw_rate: 1.0
  warmup_prime_policy_buffer: true

