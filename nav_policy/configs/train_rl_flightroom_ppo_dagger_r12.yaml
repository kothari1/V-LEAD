# PPO RL fine-tuning from the balanced-DAgger r12 BC seed (flightroom-matched).
# Inherits canonical PPO hyperparams + rollouts + rewards from
# configs/train_rl_flightroom.yaml. Only three fields change:
#   - checkpoint  (point at the new BC/DAgger seed)
#   - rl.run_tag, rl.checkpoint_dir  (separate output namespace)
# init_log_std and freeze_backbone stay at canonical defaults (-0.5, false)
# because the seed is at ~60% success on flightroom — we still need
# exploration + encoder flexibility to push past the BC prior.

base_config: configs/train_rl_flightroom.yaml

checkpoint: data/checkpoints/bc_best_balanced_dagger_r12_new.pt

rl:
  run_tag: rl_ppo_dagger_r12
  checkpoint_dir: /project/kothari1/vlead_data/rl_runs/dagger_r12
  # Matched-stable config for SAC + PPO comparison:
  #   - freeze_backbone: true     (no vision-encoder drift)
  #   - init_log_std: -2.5        (very tight Gaussian noise)
  #   - bc_anchor.kl_coef: 0.02   (penalize KL(BC || current) in policy_loss)
  #   - timeout_penalty: -20      (discourage hover-near-goal)
  #   - collision_penalty: -50    (stop trading collisions for distance)
  #   - max_rollout_s: 35         (cut wasted timeout cost)
  init_log_std: -2.5
  freeze_backbone: true
  bc_anchor:
    kl_coef: 0.02
  # Publishable success metric: deterministic closed-loop eval on the 12-query
  # held-out 071733 suite every 16 episodes (= every 4 iters with
  # rollouts_per_iteration=4). Saves _best.pt based on eval success rate
  # (not noisy training mean_return). Logs goal_success / n_rollouts per
  # query to stdout + meta + TB text.
  eval_every_episodes: 16
  eval_config: configs/eval_closed_loop_flightroom_suite.yaml
  eval_deterministic: true
  rollout:
    max_rollout_s: 35.0
    settle_vel_mps: 0.4
    action_lpf_alpha: 0.25
  rewards:
    collision_penalty: -50.0
    timeout_penalty: -20.0
    action_smooth_weight: 0.3
  ppo:
    ref_kl_coef: 0.02
