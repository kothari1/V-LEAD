# SAC on a 24 GB GPU (e.g. RTX 4090). Same as train_rl_flightroom_sac.yaml but with a
# smaller SAC batch so the gradient update fits alongside the resident gsplat renderer +
# CLIP + DA2 + policy (~20 GB). The canonical config's batch_size=256 OOMs on 24 GB.
base_config: configs/train_rl_flightroom_sac.yaml

rl:
  sac:
    batch_size: 64

  # Success-metric thresholds lifted from train_rl_local_shared_by_yash.yaml — much
  # looser than the canonical config so "near the goal" counts as success (was:
  # settle_steps 20, settle_vel 0.12, settle_body_rate 0.35, success_position_tol 0.5).
  rewards:
    success_position_tol: 1.9
  rollout:
    settle_vel_mps: 0.3
    settle_body_rate_radps: 0.85
    settle_steps: 1
